<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Moneta AI: gestão financeira pessoal com inteligência artificial</title>
    <meta
      name="description"
      content="Organize gastos, acompanhe metas e entenda suas finanças com um agente de IA dentro da plataforma. Contas, cartões, orçamento, análises e importação de extrato OFX/CSV. Grátis."
    />
    <link rel="canonical" href="https://monetaai.site/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- A landing é escura nos dois modos do sistema. -->
    <meta name="theme-color" content="#050505" />

    <link rel="icon" type="image/svg+xml" href="/moneta-mark.svg" />
    <link rel="apple-touch-icon" href="/MonetaAi-minas summit.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moneta AI" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Moneta AI: seu dinheiro, mais claro e mais inteligente" />
    <meta
      property="og:description"
      content="Gestão financeira pessoal com um agente de IA que registra, consulta e sugere. Contas, cartões, metas e análises num lugar só. Grátis."
    />
    <meta property="og:url" content="https://monetaai.site/" />
    <!--
      PENDENTE: og-cover.jpg é da direção visual anterior (peça de aço sobre
      fundo escuro). Continua coerente com a marca, mas deve ser refeito na
      direção atual (preto #050505, menta #74E8AE, escultura em anel).
      Arquivo esperado: public/assets/moneta/og-cover.jpg, 1200x630.
    -->
    <meta property="og:image" content="https://monetaai.site/assets/moneta/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marca da Moneta AI: dois anéis concêntricos com a letra M ao centro." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moneta AI: seu dinheiro, mais claro e mais inteligente" />
    <meta
      name="twitter:description"
      content="Gestão financeira pessoal com um agente de IA que registra, consulta e sugere. Contas, cartões, metas e análises num lugar só. Grátis."
    />
    <meta name="twitter:image" content="https://monetaai.site/assets/moneta/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Um pedido só para todas as famílias:
        landing ....... Bricolage Grotesque (manchetes, eixo óptico),
                        Instrument Serif (acento em itálico), Instrument Sans
                        (interface e texto), JetBrains Mono (rótulos)
        painel logado . Hanken Grotesk, Zilla Slab, JetBrains Mono
    -->
    <!-- Carregamento sem bloquear o primeiro paint: o texto aparece na fonte de
         sistema e troca quando a família chega (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      />
    </noscript>

    <!--
      Dados estruturados da landing, no HTML servido porque o app é uma SPA.
      Só o que o produto faz hoje (ver src/features/landing/data/content.ts).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://monetaai.site/#organization",
            "name": "Moneta AI",
            "url": "https://monetaai.site/",
            "logo": "https://monetaai.site/moneta-mark.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://monetaai.site/#website",
            "url": "https://monetaai.site/",
            "name": "Moneta AI",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://monetaai.site/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://monetaai.site/#app",
            "name": "Moneta AI",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://monetaai.site/",
            "inLanguage": "pt-BR",
            "description": "Plataforma gratuita de gestão financeira pessoal com um agente de inteligência artificial integrado, que registra gastos e receitas por mensagem de texto, lista movimentações, gera relatórios e sugere onde economizar.",
            "publisher": { "@id": "https://monetaai.site/#organization" },
            "featureList": [
              "Agente de IA que registra gastos e receitas por mensagem de texto",
              "Categorização automática de lançamentos",
              "Contas, carteiras, cartões de crédito e faturas",
              "Importação de extrato bancário em OFX e CSV",
              "Gastos fixos e receitas recorrentes",
              "Orçamento por categoria e metas financeiras",
              "Calendário de contas a pagar",
              "Investimentos e criptomoedas com cotação",
              "Divisão de despesas entre pessoas",
              "Análises, previsão de saldo, impacto de compra e saúde financeira",
              "Alertas por categoria no app e por e-mail",
              "Exportação de relatórios em CSV, PDF e Excel"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "BRL",
              "description": "Uso gratuito."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
